<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dad Hacks 'N Facts HQ</title>
<meta name="description" content="Dad Hacks 'N Facts HQ - short-form dad-hack comedy videos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #EDE6D6;
    --surface: #F7F3E9;
    --ink: #22281F;
    --ink-muted: #55584C;
    --border: #6B7156;
    --accent: #2F5233;
    --accent-ink: #F7F3E9;
    --gold: #E8963C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Karla', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 56px 20px;
  }

  main {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }

  img.logo {
    width: 220px;
    height: auto;
    margin-bottom: 24px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 2.8rem);
    line-height: 1.15;
    margin: 0 0 16px;
    text-wrap: balance;
  }

  p.lede {
    color: var(--ink-muted);
    font-size: 1.1rem;
    line-height: 1.55;
    margin: 0 0 32px;
  }

  .actions {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 48px;
  }

  a.button {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 8px;
    padding: 14px 24px;
  }

  a.button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--border);
  }

  footer {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.78rem;
    color: var(--ink-muted);
  }

  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Dad Hacks 'N Facts HQ logo">
  <p class="eyebrow">Dad Hacks 'N Facts HQ</p>
  <h1>Real dads. Questionable methods. Surprisingly effective.</h1>
  <p class="lede">Short comedy videos about dad hacks, garage wisdom, and the confident nonsense that comes with it.</p>
  <div class="actions">
    <a class="button" href="https://www.youtube.com/@DadHacksNFactsHQ">Watch on YouTube</a>
    <a class="button secondary" href="privacy.html">Privacy Policy</a>
  </div>
  <footer>&copy; Dad Hacks 'N Facts HQ &middot; <a href="mailto:tjubeck50@gmail.com">tjubeck50@gmail.com</a></footer>
</main>
</body>
</html>
